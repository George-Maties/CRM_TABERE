upstream crm_tabere {
    server unix:/run/crm-tabere/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name crm.domeniu.ro;

    client_max_body_size 20M;

    location /static/ {
        alias /srv/crm-tabere/static/;
        expires 30d;
        access_log off;
    }

    # Documentele participanților NU se servesc public. Django verifică permisiunile
    # și răspunde cu header-ul X-Accel-Redirect: /protected-media/<fișier>.
    location /protected-media/ {
        internal;
        alias /srv/crm-tabere/media/;
    }

    location / {
        proxy_pass http://crm_tabere;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
