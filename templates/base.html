{% load static %}<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf7f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16100d" media="(prefers-color-scheme: dark)">
  <title>{% block title %}{% endblock %} · {{ brand_name }}</title>
  <link rel="icon" href="{% static 'img/logo.png' %}" type="image/png">
  <link rel="preload" href="{% static 'vendor/barlow/barlow-latin-400-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
  <script src="{% static 'js/preferences.js' %}"></script>
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/theme.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}
  <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'js/app.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
