{% comment %}
  Usage: {% include "components/form_field.html" with field=form.name %}
  Label, field, errors and help text, styled the same everywhere.
{% endcomment %}
<div class="mb-3{% if field.errors %} field-invalid{% endif %}">
  <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-danger" aria-hidden="true">*</span>{% endif %}</label>
  {{ field }}
  {% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
</div>
